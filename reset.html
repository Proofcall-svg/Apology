<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11111B">
<meta name="robots" content="noindex">
<title>DailyDrop | Reset password</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#11111B;color:#CDD6F4;font-family:system-ui,sans-serif;padding:20px}
.c{width:100%;max-width:390px;background:#1E1E2E;border:1px solid #313244;border-radius:20px;padding:28px}
h1{margin:0 0 6px;font-size:1.5rem}p{color:#A6ADC8;line-height:1.5}
input{width:100%;box-sizing:border-box;padding:14px;margin:10px 0;border-radius:12px;border:1px solid #313244;background:#181825;color:#CDD6F4;font-size:1rem}
button{width:100%;padding:14px;border:0;border-radius:12px;background:#A78BFA;color:#11111B;font-weight:700;font-size:1rem;cursor:pointer}
#m{min-height:1.4em;color:#CBA6F7}
</style>
</head>
<body>
<div class="c">
  <h1>Choose a new password</h1>
  <p>Set a new password for your DailyDrop account, then return to the app.</p>
  <form id="f" hidden>
    <input id="p" type="password" minlength="8" placeholder="New password (8+ characters)" required autocomplete="new-password">
    <input id="q" type="password" placeholder="Repeat password" required autocomplete="new-password">
    <button type="submit">Update password</button>
  </form>
  <p id="m" role="status" aria-live="polite">Checking your reset link…</p>
</div>
<script src="./vendor/supabase.js"></script>
<script src="./config.js"></script>
<script>
(() => {
  const C = window.DD_CONFIG || {};
  const message = document.getElementById('m');
  const form = document.getElementById('f');
  const password = document.getElementById('p');
  const repeat = document.getElementById('q');

  if (!C.SUPABASE_URL || !C.SUPABASE_ANON_KEY || !window.supabase) {
    message.textContent = 'DailyDrop is not configured yet. Please contact the app administrator.';
    return;
  }

  const client = window.supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY, {
    auth: { detectSessionInUrl: true, persistSession: true, autoRefreshToken: true }
  });

  let recoveryReady = false;
  client.auth.onAuthStateChange(event => {
    if (event === 'PASSWORD_RECOVERY') {
      recoveryReady = true;
      form.hidden = false;
      message.textContent = 'Enter your new password below.';
    }
  });

  client.auth.getSession().then(({ data }) => {
    if (data && data.session && !recoveryReady) {
      form.hidden = false;
      message.textContent = 'Enter your new password below.';
    }
  });

  setTimeout(() => {
    if (form.hidden) message.textContent = 'This reset link may be invalid or expired. Request a new one in DailyDrop.';
  }, 6000);

  form.addEventListener('submit', async event => {
    event.preventDefault();
    if (password.value !== repeat.value) {
      message.textContent = 'Passwords do not match.';
      return;
    }
    if (password.value.length < 8) {
      message.textContent = 'Use at least 8 characters.';
      return;
    }
    const button = form.querySelector('button');
    button.disabled = true;
    button.textContent = 'Updating…';
    const { error } = await client.auth.updateUser({ password: password.value });
    if (error) {
      message.textContent = error.message;
      button.disabled = false;
      button.textContent = 'Update password';
      return;
    }
    form.hidden = true;
    message.textContent = 'Password updated. You can now log in to DailyDrop.';
  });
})();
</script>
</body>
</html>
